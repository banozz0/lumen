[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
lumen-core = { path = "crates/lumen-core" }
lumen-devices = { path = "crates/lumen-devices" }
lumen-hid = { path = "crates/lumen-hid" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
hidapi = { version = "2", features = ["macos-shared-device"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
